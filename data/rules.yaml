# ─────────────────────────────────────────────────────────────────────────────
# OWNER: Reasoning & Submission role          FORMAT: YAML        USED BY: src/reason.py
#
# Cross-document rules: a medicine (from a prescription) + a lab trend (from lab
# reports). A rule fires when the person takes a medicine of `drug_class` AND any
# listed test meets its condition, judged on readings from the last one before
# the medicine started onwards.
#
#   condition: rising | falling   trend over 3+ readings (reason.trend)
#              above  | below     latest reading outside the normal range
#   level:     red | amber | green
# ─────────────────────────────────────────────────────────────────────────────

- id: metformin_kidney
  drug_class: biguanide
  when: [{test: creatinine, condition: rising}, {test: egfr, condition: falling},
         {test: urea, condition: rising}]
  level: red
  title: Kidney values changing since metformin started
  ask: Should my kidney function be checked while I'm on metformin?

- id: statin_liver
  drug_class: statin
  when: [{test: sgpt_alt, condition: rising}, {test: sgot_ast, condition: rising}]
  level: amber
  title: Liver enzyme levels rising since statin started
  ask: Should my liver function be rechecked while I'm on a statin?

- id: arb_potassium
  drug_class: arb
  when: [{test: potassium, condition: above}]
  level: amber
  title: Potassium level above normal range while on an ARB
  ask: Should my potassium level be monitored while I'm on this blood-pressure medicine?

- id: ace_potassium
  drug_class: ace_inhibitor
  when: [{test: potassium, condition: above}]
  level: amber
  title: Potassium level above normal range while on an ACE inhibitor
  ask: Should my potassium level be monitored while I'm on this blood-pressure medicine?

- id: thyroid_tsh
  drug_class: thyroid_hormone
  when: [{test: tsh, condition: below}]
  level: amber
  title: TSH below normal range while on thyroid medication
  ask: Could my thyroid dose need adjusting based on my TSH level?

- id: vitd_supplement
  drug_class: vitamin_d
  when: [{test: vitamin_d, condition: below}]
  level: green
  title: Vitamin D still below normal despite supplementation
  ask: Is my current vitamin D supplementation plan working well enough?
